name: PRIME MAIL branch sanity

on:
  push:
    branches: [prime-mail-v4]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check Cloudflare Worker syntax
        run: node --check worker/index.js

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PRIME MAIL backend
        run: python -m py_compile backend/main.py backend/registry_routes.py backend/custody_routes.py backend/app.py
